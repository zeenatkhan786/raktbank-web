{% extends "base.html" %}
{% block title %}Confirm Delete{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Delete record?</h1>
  <p>Are you sure you want to delete <strong>{{ object }}</strong>? This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button type="submit" class="btn btn-danger">Yes, delete</button>
      <a href="{% url back %}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
